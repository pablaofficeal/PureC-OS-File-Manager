# Files: how to open a file
#
# extensions = action
#   extensions   comma separated list, matched against the end of the name,
#                multi-part ones work too (pkg.tar.gz)
#   action       term:COMMAND      run in a new terminal, closes when done
#                termwait:COMMAND  same, waits for Enter before closing
#                exec:COMMAND      start directly, no terminal
#                run               run the file itself in a terminal
#                pkg               ask, then run "pkg -U FILE"
#   %f in COMMAND is replaced by the quoted file path
#
# executable = ACTION   for files with the executable bit and no rule
# default = ACTION      for everything else (without it "Open with" is asked)

txt,md,log,conf,ini,cfg,json,xml,csv,c,h,cpp,hpp,cc,py,asm,s,rs,js,html,css,mk,ld,desktop,patch,diff,yml,yaml,toml = term:vim %f
sh = term:vim %f
pkg.tar.gz = pkg
executable = run
